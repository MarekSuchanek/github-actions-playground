name: Tag-to-Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Prepare artefacts
      run: |
        make dist
    
    - name: Create ZIP archive
      run: |
        zip -r dist.zip dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist.zip
